<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4efe5">
<title>Wedding Camera — prototipo</title>
<link rel="icon" href="../assets/logo-monogram.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe5;--bg-alt:#f9f6f0;--text:#3d3226;--muted:#6f604e;--accent:#5f6b4e;--border:#d1c4b2;--hl:#efe2c6;--gold:#b08a3e;--danger:#9a3412}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Lato,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:"Cormorant Garamond","Times New Roman",serif}
.muted{color:var(--muted)}
.rolebar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--text);color:var(--bg-alt);font-size:12px}
.rolebar span{opacity:.8;margin-right:auto;text-transform:uppercase;letter-spacing:.1em}
.rolebar button{background:transparent;border:1px solid rgba(249,246,240,.4);color:var(--bg-alt);border-radius:999px;min-height:32px;padding:0 12px;font-weight:700;font-size:12px;cursor:pointer}
.rolebar button.on{background:var(--bg-alt);color:var(--text)}
.lang{position:absolute;top:56px;right:12px;z-index:5;display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--bg-alt)}
.lang button{min-width:40px;min-height:32px;border:0;background:transparent;font-weight:700;font-size:12px;cursor:pointer}
.lang button.on{background:var(--accent);color:#fff}
.pad{padding:24px}
.stack{display:flex;flex-direction:column;gap:14px}
.center{align-items:center;text-align:center}
h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:32px;line-height:1.1}
p{margin:0;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:999px;border:0;font-weight:700;font-size:16px;cursor:pointer;width:100%;padding:0 18px}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border)}
.btn-list{justify-content:flex-start;border-radius:14px;background:var(--bg-alt);border:1px solid var(--border);font-size:17px}
.btn-danger{background:var(--danger);color:#fff}
.link{background:none;border:0;padding:6px 0;font-weight:700;font-size:14px;color:#4f5a3f;text-decoration:underline;cursor:pointer;text-align:left}
.field{width:100%;min-height:50px;border:1px solid var(--border);border-radius:12px;background:var(--bg-alt);padding:0 14px;font-size:16px;color:var(--text)}
label{font-size:13px;font-weight:700}
.banner{background:var(--hl);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;display:flex;gap:8px;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.cell{position:relative;aspect-ratio:1/1;border:1px solid var(--border);border-radius:8px;background:var(--bg-alt);padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(9px,2.5vw,11px);line-height:1.15;cursor:pointer;overflow:hidden}
.cell.filled{border-color:var(--accent)}
.cell.win{box-shadow:0 0 0 2px var(--gold)}
.cell.free{background:var(--hl);border-color:#c9b48a}
.cell img{width:70%;opacity:.75}
.tile{position:absolute;inset:0}
.check{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center}
.clock{position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--hl);display:flex;align-items:center;justify-content:center}
.ph0{background:url(../assets/monastery-cloister.png) 20% 40%/260% auto}
.ph1{background:url(../assets/monastery-exterior.png) 50% 30%/240% auto}
.ph2{background:url(../assets/monastery-cloister.png) 85% 60%/300% auto}
.ph3{background:url(../assets/monastery-exterior.png) 10% 70%/280% auto}
.ph4{background:url(../assets/monastery-cloister.png) 50% 20%/220% auto}
.ph5{background:url(../assets/monastery-exterior.png) 90% 50%/250% auto}
.pill{padding:2px 8px;border-radius:999px;font-weight:700;background:var(--hl)}
.pill.gone{background:var(--border);color:var(--muted);text-decoration:line-through}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-alt);border-top:1px solid var(--border);padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.tabs button,.seg button{min-height:44px;border-radius:999px;border:0;font-weight:700;font-size:14px;cursor:pointer;background:transparent}
.tabs button.on,.seg button.on{background:var(--accent);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--border);background:var(--bg-alt)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--border)}
.round{position:absolute;width:34px;height:34px;border-radius:50%;border:0;background:rgba(249,246,240,.92);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tag{position:absolute;left:6px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(61,50,38,.45);display:flex;justify-content:center}
.sheet{width:100%;max-width:480px;margin-top:auto;background:var(--bg-alt);border-radius:20px 20px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom))}
.dialog{margin:auto 24px;width:100%;max-width:420px;background:var(--bg-alt);border-radius:18px;padding:22px}
.full{position:fixed;inset:0;z-index:22;background:var(--bg);overflow:auto}
.full>div{max-width:480px;margin:0 auto}
.qr{display:grid;grid-template-columns:repeat(11,10px)}
.qr span{width:10px;height:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;z-index:30;background:var(--text);color:var(--bg-alt);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
.toast button{background:none;border:0;color:var(--hl);font-weight:700;text-decoration:underline;cursor:pointer;min-height:32px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.key{min-height:62px;border-radius:16px;border:1px solid var(--border);background:var(--bg-alt);font:400 28px "Cormorant Garamond",serif;cursor:pointer}
.dots{display:flex;gap:14px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots span.on{background:var(--accent)}
.card{background:var(--bg-alt);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.big{font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:700;line-height:1}
.bar{height:10px;border-radius:999px;background:var(--border);overflow:hidden}
.bar div{height:100%;background:var(--accent)}
.chip{min-height:38px;border-radius:999px;border:1px solid var(--border);background:var(--bg-alt);font-weight:700;font-size:13px;padding:0 14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sel{min-height:42px;border:1px solid var(--border);border-radius:10px;background:var(--bg-alt);padding:0 10px;font-size:14px;width:100%}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 0;padding-right:100px}
.hdr img{width:36px;height:36px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const P = [

const T = {
 es:{proto:"Prototipo",guest:"Invitado",host:"Anfitrión",admin:"Novios",ourWedding:"Nuestra boda",

 en:{proto:"Prototype",guest:"Guest",host:"Host",admin:"Couple",ourWedding:"Our wedding",

};
const S = {

  screen:"home", entry:"bingo", offline:false, country:"US", phone:"", phoneError:false, nameInput:"", guest:null, viaOffline:false,

};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = k => T[S.lang][k];
const ICON = {
  check:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  clock:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#3d3226" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

const MONO = "../assets/logo-monogram.png";

function lines(filled){const won={};let any=false;LINES.forEach(l=>{if(l.every(i=>i===12||filled[i])){any=true;l.forEach(i=>won[i]=true)}});return{any,won}}
function prizesLeft(){const used=S.given.map(g=>g.place);return [0,1,2].filter(p=>!used.includes(p))}
function prizesText(long){const l=prizesLeft().map(p=>PRIZE[S.lang][p]);if(!l.length)return t("allGone");const j=l.join(S.lang==="es"?" y ":" and ");return (long?t("prizesLong"):t("left")).replace("{p}",j)}
function prizePills(){return [0,1,2].map(p=>`<span class="pill ${prizesLeft().includes(p)?"":"gone"}">${PRIZE[S.lang][p]}</span>`).join("")}
function pendingCount(){return Object.keys(S.pendingSq).length+S.album.filter(m=>m.pending&&!m.bingo).length}
function toast(text,undo){S.toast={text,undo:!!undo};clearTimeout(window._tt);window._tt=setTimeout(()=>{S.toast=null;render()},5000)}
function qr(){let h="";for(let r=0;r<11;r++)for(let c=0;c<11;c++){const f=(r<3&&c<3)||(r<3&&c>7)||(r>7&&c<3);const on=f?!(r===1&&c===1)&&!(r===1&&c===9)&&!(r===9&&c===1):((r*7+c*13+r*c)%3===0);h+=`<span style="background:${on?"#3d3226":"transparent"}"></span>`}return h}

/* ---------- render + events ---------- */
function render(){
  const roleBar=`<div class="rolebar"><span>${t("proto")}</span>${["guest","host","admin"].map(r=>`<button class="${S.role===r?"on":""}" data-a="role" data-i="${r}">${t(r)}</button>`).join("")}</div>`;
  const lang=`<div class="lang"><button class="${S.lang==="es"?"on":""}" data-a="lang" data-i="es" aria-label="Español">ES</button><button class="${S.lang==="en"?"on":""}" data-a="lang" data-i="en" aria-label="English">EN</button></div>`;
  const body=S.role==="guest"?guestView():S.role==="host"?hostView():adminView();
  const tst=S.toast?`<div class="toast" role="status"><span style="flex:1">${esc(S.toast.text)}</span>${S.toast.undo?`<button data-a="undo">${t("undo")}</button>`:""}</div>`:"";
  document.getElementById("app").innerHTML=roleBar+lang+body+tst;
  document.documentElement.lang=S.lang;
}
function fill(i){
  const ph=PH[(i+Object.keys(S.filled).length)%PH.length];
  S.filled={...S.filled,[i]:ph};S.pendingSq={...S.pendingSq,[i]:true};
  S.album=S.album.concat([{id:S.nextId++,ph,bingo:true,pending:true}]);S.sheet=-1;
  if(lines(S.filled).any&&!S.bingoSeen){S.showBingo=true;S.bingoSeen=true}
}
const A={
  role:i=>{S.role=i;S.sheet=-1;S.showBingo=false;S.confirmId=null},
  lang:i=>{S.lang=i},
  start:()=>{S.screen=S.guest?(S.entry==="bingo"?"card":"album"):"phone"},
  entry:()=>{S.entry=S.entry==="bingo"?"album":"bingo"},
  offline:()=>{S.offline=!S.offline},
  go:i=>{S.screen=i;S.sheet=-1},
  submitPhone:()=>{const d=S.phone.replace(/\D/g,"");if(d.length<7){S.phoneError=true;return}
    if(S.offline){S.screen="name";S.viaOffline=true;return}S.viaOffline=false;S.screen=d.includes("5550142")?"pick":"name"},
  pick:i=>{S.guest=HOUSEHOLD[+i];S.screen=S.entry==="bingo"?"card":"album"},
  submitName:()=>{S.guest=S.nameInput.trim()||"Invitado";S.screen=S.entry==="bingo"?"card":"album"},
  switch:()=>{S.guest=null;S.phone="";S.nameInput="";S.screen="phone"},
  sim:()=>{S.pendingSq={};S.offline=false;S.album=S.album.map(m=>({...m,pending:false}));toast(t("synced"))},
  open:i=>{if(CARD[+i]!==-1)S.sheet=+i},
  closeSheet:()=>{S.sheet=-1},
  fill:()=>fill(S.sheet),
  remove:()=>{const i=S.sheet,f={...S.filled},prev=f[i];delete f[i];const p={...S.pendingSq};delete p[i];S.filled=f;S.pendingSq=p;S.sheet=-1;S.lastRemoved={i,ph:prev};S.lastDeleted=null;toast(t("removed"),true)},
  bingo:()=>{S.showBingo=true},
  closeBingo:()=>{S.showBingo=false},
  add:()=>{const id=S.nextId;S.album=S.album.concat([{id,ph:"ph3",pending:true},{id:id+1,ph:"ph5",pending:true,video:true,dur:"1:12"},{id:id+2,ph:"ph1",pending:true}]);S.nextId+=3;toast(t("refused"))},
  askDel:i=>{S.confirmId=+i},
  cancelDel:()=>{S.confirmId=null},
  doDel:()=>{const idx=S.album.findIndex(m=>m.id===S.confirmId);S.lastDeleted={item:S.album[idx],idx};S.lastRemoved=null;S.album=S.album.filter(m=>m.id!==S.confirmId);S.confirmId=null;toast(t("deleted"),true)},
  save:()=>toast(t("saved")),
  undo:()=>{if(S.lastDeleted){const a=S.album.slice();a.splice(S.lastDeleted.idx,0,S.lastDeleted.item);S.album=a;S.lastDeleted=null}else if(S.lastRemoved){S.filled={...S.filled,[S.lastRemoved.i]:S.lastRemoved.ph};S.lastRemoved=null}S.toast=null},
  key:k=>{const h=S.h;if(h.tries>=3||k==="")return;if(k==="del"){h.pin=h.pin.slice(0,-1);return}
    h.pin=(h.pin+k).slice(0,4);if(h.pin.length<4){h.error=null;return}
    if(h.pin==="2912"){h.pin="";h.screen="scan";h.tries=0;h.error=null;return}
    h.tries++;h.pin="";h.error=h.tries>=3?"Demasiados intentos. Espera 1 minuto.":"PIN incorrecto.";
    if(h.tries>=3)setTimeout(()=>{h.tries=0;h.error=null;render()},8000)},
  scan:()=>{S.h.screen="review"},
  lock:()=>{S.h.screen="pin"},
  hgo:i=>{S.h.screen=i},
  award:()=>{const l=prizesLeft();if(l.length&&!S.given.some(g=>g.who==="Carmen Rodríguez")){S.given=S.given.concat([{who:"Carmen Rodríguez",place:l[0]}]);S.h.screen="done"}},
  undoAward:i=>{if(confirm("¿Seguro? El premio quedará libre otra vez.")){S.given=S.given.filter((_,j)=>j!==+i)}},
  atab:i=>{S.a.tab=i},
  afilter:i=>{S.a.filter=i},
  star:i=>{S.a.stars={...S.a.stars,[i]:!S.a.stars[i]}}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  if(el.classList.contains("overlay")&&e.target.closest("[data-stop]"))return;
